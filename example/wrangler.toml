name = "aurelia-hono-ssr"
main = "dist/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
WORKER = "true"

[[d1_databases]]
binding = "DB"
database_name = "aurelia-ssr-db"
database_id = "e6e31e36-4273-404e-a790-ae68083c5699"

[build]
command = "bun run build && bun run build:worker"
